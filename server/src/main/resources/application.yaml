server:
  port: 8080

spring:
  application:
    name: libro-server

    datasource:
      url: { DB_URL:jdbc:h2:mem:librodb }
      username: { DB_USERNAME:sa }
      password: { DB_PASSWORD: }
      driverClassName: { DB_DRIVER:org.h2.Driver }
    h2:
      console:
        enabled: true
        path: /h2-console
#  datasource:
#    url: jdbc:postgresql://localhost:5432/libro
#    username: postgres
#    password: password
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


