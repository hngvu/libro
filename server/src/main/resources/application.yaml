server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: libro-server
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:h2:mem:librodb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driverClassName: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    web:
      pageable:
        page-parameter: page
        size-parameter: size
        one-indexed-parameters: true

#  datasource:
#    url: jdbc:postgresql://localhost:5432/libro
#    username: postgres
#    password: password
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


jwt:
  secret: 2p22zEkXJByQUna3k6Oum/ZHMhBdepWA2+JPLbfvFO8=

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder_libro_development_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder_libro_development_secret}
  currency: ${STRIPE_CURRENCY:usd}

fine:
  daily-rate: ${FINE_DAILY_RATE:0.50}
  default-lost-fee: ${FINE_DEFAULT_LOST_FEE:20.00}
  default-damaged-fee: ${FINE_DEFAULT_DAMAGED_FEE:10.00}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-name: ${AWS_S3_BUCKET_NAME:libro-storage}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-url-prefix: ${AWS_S3_PUBLIC_URL_PREFIX:}

storage:
  local:
    upload-dir: ${LOCAL_STORAGE_DIR:uploads}
    base-url: ${LOCAL_STORAGE_BASE_URL:http://localhost:8080/api/storage/files}

